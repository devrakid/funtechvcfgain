<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <!-- Montserrat Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
  <title>Admin server</title>
  <style>
        :root {
      --neon-blue: #00f3ff;
      --mint-green: #00FF85;
      --neon-green: #8EFF73;
      --primary-green:#00ff9d;
      --primary-blue:#1E6EFF;
      --warm-purple: #7B61FF;
      --dark-bg: #0A0A0A;
      --navblack-bg: #101015;
      --card-bg: #0D1117;
      --error: #C0392B;
    }
    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }
    a {
      color:inherit;
      text-decoration:none;
    }
    body {
      background:var(--dark-bg);
      background-image:linear-gradient(
        to right,
        rgba(255,255,255,0.05)1px,
        transparent 1px),
        linear-gradient(
        to bottom,
        rgba(255,255,255,0.05)1px,
        transparent 2px);
      background-size:80px 80px;
      min-height: 100vh;
    }
        /* ── Login Screen ── */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 40px rgba(0,243,255,0.08);
      transition:transform 0.8s;
      animation: fadein 0.45s ease both;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .login-card:hover {
      border: 1px solid rgba(25, 255, 255, 0.2);
      transform: translateY(-10px);
    }
    .login-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: transparent;
      border:1px solid var(--neon-blue);
      display: flex;
      padding-left:5px;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 20px;
    }
    .login-card h1 {
      text-align:center;
      margin-bottom:8px;
      color:white;
      text-shadow: 0 0 1px #14FFEC, 0 0 5px #14FFEC;
      font-family: Poppins, sans-serif;
      font-size: 25px;
      color: white;
    }
    .login-card p {
      font-family: Poppins, sans-serif;
      text-align:center;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 28px;
    }
    .login-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      font-family:Montserrat, sans-serif;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }
    .login-card input {
      width: 100%;
      height: 48px;
      background: #101015;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: white;
      padding: 0 14px;
      font-family: Montserrat, sans-serif;
      font-size: 13px;
      margin-bottom: 20px;
      transition: border 0.2s;
    }
    .login-card input:focus {
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      outline: none;
      border-color: rgba(0,243,255,0.4);
    }
    .login-btn {
      width: 100%;
      height: 50px;
      background: linear-gradient(90deg, var(--warm-purple), var(--neon-blue));
      color: white;
      font-family: Roboto, Arial;
      font-weight: bold;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.8; }
    #loginError {
      color: var(--error);
      font-size: 13px;
      display: none;
    }
    
            /* ── Main Dashboard ── */
    #dashboard { 
      display:none;
      padding: 30px 20px; 
      max-width: 900px; 
      margin: 0 auto; 
    }
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }
    .dash-header h1 {
      font-family: Poppins, sans-serif;
      font-size: 22px;
      color: white;
    }
    .dash-header h1 span {
      color: var(--neon-blue);
      text-shadow: 0 0 8px var(--neon-blue);
    }
    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.55);
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: Roboto, Arial;
      transition: opacity 0.2s;
    }
    .logout-btn:hover { opacity: 0.7; }

    /* Stats row */
    .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .stat-card {
      flex: 1;
      min-width: 140px;
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 20px;
    }
    .stat-label {
      font-family: Roboto, sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .stat-value {
      font-family: Poppins, sans-serif;
      font-size: 32px;
      font-weight: 600;
      color: transparent;
      background: linear-gradient(90deg, var(--primary-blue), var(--neon-blue));
      background-clip: text;
    }

    /* Download button */
    .download-btn {
      display: inline-block;
      align-items: center;
      background: linear-gradient(90deg, var(--neon-blue), #00e676);
      color: #000;
      font-family: Roboto, Arial;
      font-weight: bold;
      font-size: 14px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 28px;
      transition: opacity 0.2s, transform 0.35s;
    }
    .download-btn svg{width:16px;height:16px;margin-right:8px;}
    .download-btn:hover { opacity: 0.85; transform: translateY(-2px);}

    /* Delete all button */
    .delete-all-btn {
      align-items: center;
      background: transparent;
      color: #ff6b6b;
      font-family: Roboto, Arial;
      font-weight: bold;
      font-size: 13px;
      padding: 12px 20px;
      border: 1px solid rgba(255,107,107,0.35);
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 28px;
      margin-left: 12px;
      transition: opacity 0.2s;
    }
    .delete-all-btn svg {width:15px;height:15px;margin-right:4px;}
    .delete-all-btn:hover { opacity: 0.7; }

    /* Table */
    .table-wrap {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      overflow: hidden;
    }
    .table-toolbar {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .table-toolbar span {
      font-family:Roboto, Arial;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
    #searchInput {
      background: #101015;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: white;
      padding: 8px 14px;
      font-size: 13px;
      font-family: Montserrat, sans-serif;
      width: 200px;
    }
    #searchInput:focus { outline: none; border-color: rgba(0,243,255,0.35); }

    table { width: 100%; border-collapse: collapse; }
    thead { background: rgba(255,255,255,0.03); }
    th {
      font-family:Roboto, Arial;
      text-align: left;
      padding: 14px 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }
    td {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 14px;
      color: rgba(255,255,255,0.8);
    }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .td-name { color: white; font-weight: 600;font-family: Roboto, Arial; }
    .td-number { color: var(--neon-blue); font-family: Roboto, Arial; letter-spacing: 0.3px; }
    .td-date { color: rgba(255,255,255,0.35); font-size: 12px;font-family: Roboto, Arial; }
    .del-row-btn {
      background: transparent;
      border: none;
      color: rgba(255,107,107,0.55);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      transition: color 0.2s;
    }
    .del-row-btn:hover { color: #ff6b6b; }

    #emptyMsg {
      text-align: center;
      padding: 50px 20px;
      color: rgba(255,255,255,0.25);
      font-size: 14px;
      display: none;
    }

    /* ── Admin Settings (added) ── */
    .settings-card {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 22px 20px;
      margin-top: 28px;
    }
    .settings-title {
      font-family: Poppins, sans-serif;
      color: #fff;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .settings-card label {
      font-family:Roboto, Arial;
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }
    .settings-card input {
      width: 100%;
      height: 46px;
      background: #101015;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #fff;
      padding: 0 14px;
      font-family: Montserrat, sans-serif;
      font-size: 13px;
      margin-bottom: 18px;
      transition: border 0.2s;
    }
    .settings-card input:focus {
      outline: none;
      border-color: rgba(0,243,255,0.4);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .settings-save-btn {
      height: 46px;
      padding: 0 26px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: Roboto, Arial;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      background: linear-gradient(90deg, var(--neon-blue), #00e676);
      transition: opacity 0.2s, transform 0.35s;
    }
    .settings-save-btn:hover { opacity: 0.85; transform: translateY(-2px); }
    .settings-msg {
      margin-left: 14px;
      color: var(--mint-green);
      font-size: 13px;
      font-family: Montserrat, sans-serif;
    }
  </style>
</head>

<body>
    <!-- Login Screen -->
    <div id="loginScreen">

        <!-- Dashboard -->
  <div id="dashboard">
    <div class="dash-header">
      <h1>Admin <span>Dashboard</span></h1>

    </div>
    
    <div class="stats-row">

    <div class="table-wrap">

    <script>
    const ADMIN_HASH = 'ff219d5659d17143af420163aa2ab5478b34cc69c925cf851f7559266f812d28';

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function login() {
  const input = document.getElementById('adminPass');
  const pass = input.value;
  const passHash = await sha256(pass);

  if (passHash === ADMIN_HASH) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    startListening();
  } else {
    document.getElementById('loginError').style.display = 'block';
    // Shake input briefly
    input.style.borderColor = 'var(--error)';
    setTimeout(() => {
      input.style.borderColor = '';
    }, 1000);
  }
}

function logout() {
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPass').value = '';
}

    </script>

    <!-- Supabase JS client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- ============================================================
         SUPABASE INTEGRATION — admin.html
         Implements the functions the existing markup already calls:
         startListening(), filterTable(), downloadVCF(), confirmDeleteAll()
         plus per-row delete, live stats, realtime updates and settings.
         These are defined on `window` so the inline onclick handlers work.
    ============================================================ -->
    <script>
    (function () {
      "use strict";

      /* ---------- CONFIG (must match index.html) ---------------- */
      const SUPABASE_URL      = "https://pjkrfwowudnbymewxzqt.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_gHW-Oy-BAoYT-dXbVcyRpg_w83elv4m";

      /* ---------- INIT ------------------------------------------ */
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const $ = (id) => document.getElementById(id);

      let allContacts = [];                 // full dataset (newest first)
      let adminSettings = { whatsapp_link: "", registration_target: 300, website_title: "VCF Contacts Gain" };
      let realtimeChannel = null;

      /* ---------- HELPERS --------------------------------------- */
      function escapeHtml(s) {
        return (s == null ? "" : String(s))
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function formatDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) +
               " · " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
      }

      /* ---------- SETTINGS -------------------------------------- */
      async function loadAdminSettings() {
        try {
          const { data, error } = await sb.from("app_settings").select("*").eq("id", 1).single();
          if (!error && data) {
            adminSettings = data;
            fillSettingsForm();
          }
        } catch (e) { console.error("settings:", e); }
      }
      function fillSettingsForm() {
        if ($("setWhatsapp")) $("setWhatsapp").value = adminSettings.whatsapp_link || "";
        if ($("setTarget"))   $("setTarget").value   = adminSettings.registration_target || "";
        if ($("setTitle"))    $("setTitle").value    = adminSettings.website_title || "";
      }
      async function saveSettings() {
        const link   = ($("setWhatsapp").value || "").trim();
        const title  = ($("setTitle").value || "").trim();
        const tNum   = parseInt($("setTarget").value, 10);
        if (!isNaN(tNum) && tNum < 1) { alert("Target must be at least 1."); return; }

        const payload = {
          id: 1,
          whatsapp_link: link,
          registration_target: isNaN(tNum) ? adminSettings.registration_target : tNum,
          website_title: title || adminSettings.website_title,
          updated_at: new Date().toISOString()
        };

        const btn = $("saveSettingsBtn");
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = "Saving…";
        try {
          const { error } = await sb.from("app_settings").upsert(payload);
          if (error) { alert("Could not save settings: " + error.message); return; }
          adminSettings = payload;
          renderStats();
          if ($("settingsMsg")) {
            $("settingsMsg").textContent = "✓ Settings saved";
            setTimeout(() => { $("settingsMsg").textContent = ""; }, 2500);
          }
        } catch (e) {
          alert("Network error while saving settings.");
          console.error(e);
        } finally {
          btn.disabled = false; btn.textContent = orig;
        }
      }

      /* ---------- DATA ------------------------------------------ */
      async function fetchContacts() {
        try {
          const { data, error } = await sb
            .from("registrations").select("*").order("created_at", { ascending: false });
          if (error) { console.error("fetch:", error); return; }
          allContacts = data || [];
          // Re-apply any active search filter, otherwise show all.
          const q = $("searchInput") ? $("searchInput").value.trim() : "";
          renderTable(q ? filterList(q) : allContacts);
          renderStats();
        } catch (e) { console.error("fetch:", e); }
      }

      function renderStats() {
        const total  = allContacts.length;
        const target = adminSettings.registration_target || 0;

        if ($("stat-total")) $("stat-total").textContent = total.toLocaleString();
        if ($("statTarget")) $("statTarget").textContent = target.toLocaleString();
        if ($("statLeft"))   $("statLeft").textContent   = Math.max(target - total, 0).toLocaleString();

        const now = new Date();
        const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const startWeek = new Date(startToday);
        startWeek.setDate(startToday.getDate() - startToday.getDay()); // Sunday start
        let today = 0, week = 0;
        allContacts.forEach((c) => {
          const d = new Date(c.created_at);
          if (d >= startToday) today++;
          if (d >= startWeek)  week++;
        });
        if ($("stat-today")) $("stat-today").textContent = today.toLocaleString();
        if ($("stat-week"))  $("stat-week").textContent  = week.toLocaleString();
      }

      function renderTable(list) {
        const body = $("tableBody");
        if (!body) return;
        body.innerHTML = "";
        if ($("tableCount")) {
          $("tableCount").textContent = list.length + " contact" + (list.length !== 1 ? "s" : "");
        }
        if ($("emptyMsg")) $("emptyMsg").style.display = list.length ? "none" : "block";

        list.forEach((c, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML =
            "<td>" + (i + 1) + "</td>" +
            '<td class="td-name">'   + escapeHtml(c.contact_name) + "</td>" +
            '<td class="td-number">' + escapeHtml(c.phone_number) + "</td>" +
            '<td class="td-date">'   + formatDate(c.created_at)   + "</td>" +
            '<td><button class="del-row-btn" title="Delete" data-id="' + escapeHtml(c.id) + '">&#10005;</button></td>';
          body.appendChild(tr);
        });
        body.querySelectorAll(".del-row-btn").forEach((b) => {
          b.addEventListener("click", () => deleteContact(b.dataset.id));
        });
      }

      /* ---------- SEARCH ---------------------------------------- */
      function filterList(q) {
        const s = q.toLowerCase();
        return allContacts.filter((c) =>
          (c.contact_name || "").toLowerCase().includes(s) ||
          (c.phone_number || "").toLowerCase().includes(s));
      }
      function filterTable() {
        const q = $("searchInput") ? $("searchInput").value.trim() : "";
        renderTable(q ? filterList(q) : allContacts);
      }

      /* ---------- DELETE ---------------------------------------- */
      async function deleteContact(id) {
        if (!confirm("Delete this contact?")) return;
        try {
          const { error } = await sb.from("registrations").delete().eq("id", id);
          if (error) { alert("Could not delete: " + error.message); return; }
          allContacts = allContacts.filter((c) => c.id !== id);
          filterTable(); renderStats();
        } catch (e) { alert("Network error while deleting."); console.error(e); }
      }
      async function confirmDeleteAll() {
        if (!allContacts.length) { alert("No contacts to delete."); return; }
        if (!confirm("Delete ALL " + allContacts.length + " contacts? This cannot be undone.")) return;
        try {
          // neq against an impossible id deletes every row
          const { error } = await sb.from("registrations")
            .delete().neq("id", "00000000-0000-0000-0000-000000000000");
          if (error) { alert("Could not clear: " + error.message); return; }
          allContacts = [];
          renderTable(allContacts); renderStats();
        } catch (e) { alert("Network error while clearing."); console.error(e); }
      }

      function normalizeNumber(num) {
  let cleaned = (num || "").replace(/[^\d+]/g, '');

  if (cleaned.startsWith('+')) return cleaned;
  if (cleaned.startsWith('234') && cleaned.length === 13) return '+' + cleaned;
  if (cleaned.startsWith('0') && cleaned.length === 11) return '+234' + cleaned.slice(1);
  if (/^[789]\d{9}$/.test(cleaned)) return '+234' + cleaned;
  if (cleaned.length >= 10) return '+' + cleaned;

  return cleaned;
}

      function downloadPreviewCSV() {
  if (!allContacts.length) { alert("No contacts to preview yet."); return; }

  const rows = allContacts.map((c) => {
    const name = (c.contact_name || "").trim();
    const original = (c.phone_number || "").trim();
    const normalized = normalizeNumber(original);
    const changed = original !== normalized ? "YES" : "no";
    return [name, original, normalized, changed]
      .map(v => `"${(v || "").replace(/"/g, '""')}"`)
      .join(",");
  });

  const csv = ["Name,Original Number,Normalized Number,Changed"].concat(rows).join("\r\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "vcf_preview_check.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}


      

      /* ---------- EXPORT VCF ------------------------------------ */
      function downloadVCF() {
        if (!allContacts.length) { alert("No contacts to export yet."); return; }
        // Build one vCard per contact using the EXACT name the user entered.
        const vcf = allContacts.map((c) => {
          const name = (c.contact_name || "").replace(/\r?\n/g, " ").trim();
          const tel  = normalizeNumber((c.phone_number || "").trim());

          return [
            "BEGIN:VCARD",
            "VERSION:3.0",
            "FN:" + name,
            "N:;" + name + ";;;",
            "TEL;TYPE=CELL:" + tel,
            "END:VCARD"
          ].join("\r\n");
        }).join("\r\n");

        const blob = new Blob([vcf], { type: "text/vcard;charset=utf-8" });
        const url  = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "funtechcontactsgain" + ".vcf";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      /* ---------- REALTIME -------------------------------------- */
      function subscribeRealtime() {
        if (realtimeChannel) return;
        realtimeChannel = sb.channel("admin-registrations")
          .on("postgres_changes",
              { event: "*", schema: "public", table: "registrations" },
              fetchContacts)
          .subscribe();
      }

      /* ---------- ENTRY POINT (called by existing login()) ------ */
      async function startListening() {
        await loadAdminSettings();
        await fetchContacts();
        subscribeRealtime();
      }

      /* ---------- EXPOSE for inline onclick handlers ------------ */
      window.startListening   = startListening;
      window.filterTable      = filterTable;
      window.downloadVCF      = downloadVCF;
      window.confirmDeleteAll = confirmDeleteAll;
      window.saveSettings     = saveSettings;
    })();
    </script>
</body>
